      autoTimer = setTimeout(function(){ retryFailed(); }, 20000);
    } else {
      document.getElementById("warn").style.display = "none";
      if (!ptReady) { ptReady = true; paint(); }
      paintProgress();
    }
  }
  function retryFailed(){
    QUEUE = FILES.filter(function(f){ return !okCount[f]; });
    done = {}; trying = {};
    document.getElementById("warn").innerHTML = "正在重试失败分片…";
    pump();
  }
  function manualRetry(){ if (autoTimer) clearTimeout(autoTimer); retryFailed(); }
  function paintProgress(){
    var loadedN = ptn();
    document.getElementById("pbar").style.width = Math.round(loadedN / FILES.length * 100) + "%";
    var st = document.getElementById("stat");
    st.innerHTML = "<span>已加载立绘 <b>" + loadedN + "</b> / " + 716 + " 张</span>" +
      "<span>分片 <b>" + ptN() + "</b> / " + FILES.length + "</span>" +
      "<span>武将总数 <b>" + G.length + "</b></span>";
  }

  /* ---- 渲染 ---- */
  function list(){
    var arr = G.filter(function(g){ return window.__SG_PT__[g.name]; });
    if (state.fac !== "all") arr = arr.filter(function(g){ return g.faction === state.fac; });
    if (state.tier !== "all") arr = arr.filter(function(g){ return tierOf(g).n === state.tier; });
    var q = state.q.trim().toLowerCase();
    if (q) arr = arr.filter(function(g){ return (g.name + g.zi + g.title + g.skill + g.skillDesc).toLowerCase().indexOf(q) >= 0; });
    if (state.sort === "name") arr.sort(function(a,b){ return a.name.localeCompare(b.name, "zh"); });
    else if (state.sort === "fac") arr.sort(function(a,b){ return a.faction.localeCompare(b.faction, "zh") || b.sum - a.sum; });
    else if (state.sort === "tier") arr.sort(function(a,b){ return tierOf(a).min - tierOf(b).min || b.sum - a.sum; });
    else arr.sort(function(a,b){ return b.sum - a.sum; });
    return arr;
  }
  function paint(){
    state.loaded = true;
    var arr = list(), shown = arr.slice(0, state.limit);
    var fcCount = {}, tcCount = {};
    G.forEach(function(g){ if (window.__SG_PT__[g.name]) { fcCount[g.faction] = (fcCount[g.faction]||0)+1; tcCount[tierOf(g).n] = (tcCount[tierOf(g).n]||0)+1; } });
    /* 阵营 chips */
    var fh = '<button class="chip' + (state.fac==="all"?" on":"") + '" data-f="all">全部 ' + (arr.length && state.fac==="all" ? arr.length : Object.keys(fcCount).reduce(function(s,k){ return s+fcCount[k]; },0)) + '</button>';
    Object.keys(FACTION).forEach(function(f){
      if (!fcCount[f]) return;
      var on = state.fac === f;
      fh += '<button class="chip' + (on?" on":"") + '" data-f="' + f + '"' + (on ? (" style='background:"+FACTION[f].color+";color:#14161c;font-weight:700'") : "") + '>' + FACTION[f].name + ' ' + fcCount[f] + '</button>';
    });
    document.getElementById("facChips").innerHTML = fh;
    /* 品级 chips */
    var th = '<button class="chip' + (state.tier==="all"?" on":"") + '" data-t="all">全部</button>';
    TIERS.forEach(function(t){
      if (!tcCount[t.n]) return;
      var on = state.tier === t.n;
      th += '<button class="chip' + (on?" on":"") + '" data-t="' + t.n + '" style="border-color:' + t.c + '66;color:' + (on ? "#14161c" : t.c) + (on ? ";background:"+t.c+";font-weight:700" : "") + '">' + t.n + ' ' + tcCount[t.n] + '</button>';
    });
    document.getElementById("tierChips").innerHTML = th;
    /* 网格 */
    document.getElementById("grid").innerHTML = shown.length ? shown.map(function(g){
      var tr = tierOf(g), f = FACTION[g.faction];
      return '<div class="card" data-n="' + esc(g.name) + '" data-id="' + esc(g.id) + '">' +
        '<div class="ph"><img loading="lazy" src="' + window.__SG_PT__[g.name] + '" alt="' + esc(g.name) + '"></div>' +
        '<span class="tier" style="color:' + tr.c + '">' + tr.n + '</span>' +
        '<div class="cap"><b>' + esc(g.name) + '</b><i style="color:' + (f ? f.color : "#8a6a3a") + '">' + (f ? f.name : esc(g.faction)) + '</i></div></div>';
    }).join("") : '<div class="empty">' + (ptn() ? "没有符合条件的立绘，试试更换筛选条件" : "立绘分片加载中，请稍候…") + '</div>';
    var left = arr.length - shown.length;
    document.getElementById("more").innerHTML = left > 0 ? '<button id="moreBtn">显示更多（还有 ' + left + ' 位）</button>' : '';
    document.getElementById("cnt").textContent = "已配图 " + ptn() + " / " + G.length + " · 筛选结果 " + arr.length + " 位";
    var mb = document.getElementById("moreBtn");
    if (mb) mb.onclick = function(){ state.limit += 120; paint(); };
    Array.prototype.forEach.call(document.querySelectorAll("#facChips .chip"), function(el){
      el.onclick = function(){ state.fac = el.getAttribute("data-f"); state.limit = 96; paint(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("#tierChips .chip"), function(el){
      el.onclick = function(){ state.tier = el.getAttribute("data-t"); state.limit = 96; paint(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".card"), function(el){
      el.onclick = function(){ openLb(el.getAttribute("data-n")); };
    });
  }
  /* ---- 大图 ---- */
  var lb = document.getElementById("lb");
  function openLb(name){
    var g = G.filter(function(x){ return x.name === name; })[0]; if (!g) return;
    var tr = tierOf(g), f = FACTION[g.faction];
    document.getElementById("lbi").src = window.__SG_PT__[name];
    document.getElementById("lbn").innerHTML = '<i style="color:' + (f?f.color:"#8a6a3a") + '">' + (f?f.name:esc(g.faction)) + '</i>' + esc(g.name) + (g.zi ? '<span style="color:#a8b3c2;font-size:14px">（' + esc(g.zi) + '）</span>' : '') +
      ' <span style="color:' + tr.c + ';font-size:14px">' + tr.n + '阶</span>';
    document.getElementById("lbs").textContent = "统率 " + g.st + " · 武力 " + g.wu + " · 智力 " + g["in"] + " · 政治 " + g.po + " · 魅力 " + g.ch + "（合计 " + g.sum + "）" + (g.skill ? " · 特技：" + g.skill : "");
    lb.style.display = "flex";
  }
  document.getElementById("lbx").onclick = function(){ lb.style.display = "none"; };
  lb.onclick = function(e){ if (e.target === lb) lb.style.display = "none"; };
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") lb.style.display = "none"; });
  document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; state.limit = 96; paint(); });
  document.getElementById("sort").addEventListener("change", function(e){ state.sort = e.target.value; paint(); });
  paintProgress();
  paint();
  pump();
})();
</script>
</body>
</html>
